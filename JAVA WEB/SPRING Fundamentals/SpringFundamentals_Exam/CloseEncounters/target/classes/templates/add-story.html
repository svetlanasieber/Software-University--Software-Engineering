<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}">
    <title>Add Story</title>
</head>
<body>
<main>
    <section class="section full-height">

        <form class="welcome login" th:action="@{/stories/new}" th:method="POST" th:object="${storyAddDTO}">

            <h3>Add story</h3>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="title" class="h3 mb-2">Title</label>
                </div>
                <input type="text" placeholder="Title" id="title" name="title" th:field="*{title}" th:errorclass="is-invalid">
                <p class="text-warning" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error Text Here</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="description" class="h3 mb-2">Description</label>
                </div>
                <textarea type="text" placeholder="Description" id="description" name="description" th:field="*{description}" th:errorclass="is-invalid"></textarea>
                <p class="text-warning" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error Text Here</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="kind" class="h3 mb-2">Kind</label>
                </div>
                <select id="kind" name="kind" th:field="*{kind}" th:errorclass="is-invalid">
                    <option value="">Select kind</option>
                    <option value="FIRST">FIRST</option>
                    <option value="SECOND">SECOND</option>
                    <option value="THIRD">THIRD</option>
                    <option value="FOURTH">FOURTH</option>
                </select>
                <p class="text-warning" th:if="${#fields.hasErrors('kind')}" th:errors="*{kind}">Error Text Here</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="date" class="h3 mb-2">Date</label>
                </div>
                <input type="date" placeholder="Date" id="date" name="date" th:field="*{date}" th:errorclass="is-invalid">
                <p class="text-warning" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Error Text Here</p>
            </div>

            <button type="submit">Add</button>

        </form>
    </section>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
