<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/commons::head}">
    <title>Edit Profile</title>
</head>
<body>
<header th:replace="~{fragments/commons::nav}"></header>
<main>
    <section class="section full-height">

        <form class="welcome login" method="post">
            <div class="form-group">
                <h3>Edit Profile</h3>
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="firstName" class="h3 mb-2">First Name</label>
                </div>
                <input type="text"
                       id="firstName"
                       placeholder="Enter your first name" name="firstName" th:value="${userProfileDTO.firstName}">
                <p class="text-light" th:if="${#fields.hasErrors('userProfileDTO.firstName')}" th:errors="${userProfileDTO.firstName}">First name length must be between 2 and 20 characters</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="lastName" class="h3 mb-2">Last Name</label>
                </div>
                <input type="text"
                       id="lastName"
                       placeholder="Enter your last name" name="lastName" th:value="${userProfileDTO.lastName}">
                <p class="text-light" th:if="${#fields.hasErrors('userProfileDTO.lastName')}" th:errors="${userProfileDTO.lastName}">Last name length must be between 2 and 20 characters</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="email" class="h3 mb-2">Email</label>

                </div>
                <input type="text"
                       id="email"
                       placeholder="Enter your email" name="email" th:value="${userProfileDTO.email}">
                <p class="text-light" th:if="${#fields.hasErrors('userProfileDTO.email')}" th:errors="${userProfileDTO.email}">Enter valid email address</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="password" class="h3 mb-2">Change password</label>

                </div>
                <input type="password"
                       id="password"
                       placeholder="Enter your password" name="password">
                <p class="text-light" th:if="${#fields.hasErrors('userProfileDTO.password')}" th:errors="${userProfileDTO.password}">Password must be between 4 and 20 characters</p>
            </div>

            <div class="form-group">
                <div class="label-holder text-white d-flex justify-content-center">
                    <label for="profilePicture" class="h3 mb-2">Profile Picture URL</label>
                </div>
                <input type="text"
                       id="profilePicture" name="profilePicture" th:value="${userProfileDTO.profilePicture}">
                <p class="text-light" th:if="${#fields.hasErrors('userProfileDTO.profilePicture')}" th:errors="${userProfileDTO.profilePicture}">Must contain a valid URL</p>
            </div>
            <button type="submit" class="profile-actions-button">
                Save
            </button>
        </form>

    </section>
</main>
<footer th:replace="~{fragments/commons::footer}"></footer>
</body>
</html>
