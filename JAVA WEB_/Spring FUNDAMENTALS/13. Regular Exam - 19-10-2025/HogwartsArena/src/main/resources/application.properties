spring.application.name=Hogwarts Arena

# MVC configuration
spring.mvc.hiddenmethod.filter.enabled=true

# ==================================================================================
# DATABASE CONFIGURATION
# ==================================================================================
# Default: MySQL on localhost:3306 with root user and EMPTY password
# 
# If your MySQL password is different:
#   1. Copy src/main/resources/application-local.properties.example 
#      to src/main/resources/application-local.properties
#   2. Set your password in application-local.properties
#
# OR simply change the password below:
# ==================================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/wizarding_arena?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=kad0renk 1212

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.hibernate.persister.entity=ERROR